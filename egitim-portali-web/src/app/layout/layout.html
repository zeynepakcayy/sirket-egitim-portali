<div class="layout-wrapper">

  <!-- NAVBAR — D2'de doldurulacak -->
  <header class="layout-navbar">

    <span class="navbar-title">Training Portal</span>

    <div class="navbar-actions">

      <!-- ARAMA — şimdilik işlevsiz -->
      <span class="navbar-search">
        <i class="pi pi-search"></i>
        <input pInputText type="text" placeholder="Search..." />
      </span>

      <!-- BİLDİRİM — rozet, açılır panel ve okundu işaretleme
           bileşenin kendi içinde. Buradan yönetilmiyor. -->
      <app-notification-bell />

      <!-- AVATAR + MENÜ
           Ad soyad avatar'ın soluna geldi. Tıklama alanı artık
           ikisini birden kapsıyor: isme de basınca menü açılıyor. -->
      <button
        class="navbar-user"
        type="button"
        aria-label="User menu"
        (click)="userMenu.toggle($event)">

        <span class="navbar-user-name">{{ currentUser()?.fullName }}</span>

        <p-avatar
          [label]="initials()"
          shape="circle"
          styleClass="navbar-avatar" />
      </button>

      <p-menu #userMenu [model]="userMenuItems" [popup]="true" />

    </div>
  </header>

  <!-- SIDEBAR — D3'te doldurulacak -->
  <aside class="layout-sidebar">

    <nav class="sidebar-nav">
      @for (item of mainNavItems(); track item.route) {
        
          <a class="sidebar-item"
          [routerLink]="item.route"
          routerLinkActive="sidebar-item-active">
          <i [class]="item.icon"></i>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    @if (managementNavItems().length > 0) {
      <div class="sidebar-divider"></div>

      <nav class="sidebar-nav">
        @for (item of managementNavItems(); track item.route) {
        
            <a class="sidebar-item"
            [routerLink]="item.route"
            routerLinkActive="sidebar-item-active">
            <i [class]="item.icon"></i>
            <span>{{ item.label }}</span>
          </a>
        }
      </nav>
    }

  </aside>

  <!-- SAYFALAR BURAYA GELİYOR -->
  <main class="layout-content">
    <router-outlet />
  </main>

</div>
