<div class="flex justify-content-center align-items-center min-h-screen">
  <div class="surface-card p-5 shadow-2 border-round text-center" style="max-width: 420px;">

    <i class="pi pi-lock text-6xl text-red-500 mb-3 block"></i>

    <h2 class="mt-0 mb-2">Access Denied</h2>

    <p class="text-500 line-height-3 mb-4">
      You don't have permission to view this page.
      @if (currentRole) {
        <br />You are signed in as <strong>{{ currentRole }}</strong>.
      }
    </p>

    <p-button label="Back to Login" icon="pi pi-arrow-left" (onClick)="goBack()" />
  </div>
</div>
